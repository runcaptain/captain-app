[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "captain-search"
version = "0.1.0"
description = "Version, backtest and deploy search pipelines, and mine data for them."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "pyyaml>=6",
  "fsspec>=2024.6",
  "sqlalchemy>=2.0",
  "duckdb>=1.0",
  "duckdb-engine>=0.13",
  "pyarrow>=16",
  "keyring>=25",
  "python-ulid>=2",
  "sqlglot>=25",
  "numpy>=1.26",
  "pandas>=2.1",
  "httpx>=0.27",
  "anthropic>=0.40",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jupyter_client>=8",
  "ipykernel>=6.29",
  "boto3>=1.35",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35"]
gcs = ["google-cloud-storage>=2.18"]
azure = ["azure-storage-blob>=12.20"]
# SDKs the compute providers call (compute_providers/). AWS needs only boto3, which is a base dependency.
compute-gcp = ["google-cloud-run>=0.10", "google-cloud-aiplatform>=1.60", "google-cloud-logging>=3.10"]
compute-azure = ["azure-identity>=1.17", "azure-mgmt-appcontainers>=3.0", "azure-ai-ml>=1.18", "azure-monitor-query>=1.4"]
modal = ["modal>=0.64"]
team-server = ["psycopg[binary]>=3.1,<4", "PyJWT[crypto]>=2.10.1,<3"]
postgres = ["psycopg[binary]>=3.1"]
# Every database the app's "Connect a database" form offers (connectors/kinds.py). Captain.app bundles this extra.
warehouses = ["psycopg[binary]>=3.1", "snowflake-sqlalchemy>=1.7", "databricks-sqlalchemy>=2.0", "sqlalchemy-bigquery>=1.11",
              "pymysql>=1.1", "trino[sqlalchemy]>=0.330", "pyathena[sqlalchemy]>=3.9", "clickhouse-sqlalchemy>=0.3",
              "pymssql>=2.3", "duckdb-engine>=0.13", "google-analytics-data>=0.18"]
dev = ["pytest>=8", "moto[s3]>=5", "boto3>=1.35"]

[project.scripts]
cst = "captain_search.cli.main:app"

[tool.setuptools.packages.find]
include = ["captain_search*"]

[tool.setuptools.package-data]
captain_search = ["skills_builtin/*/SKILL.md", "view_template/*", "view_template/.gitignore"]

[tool.pytest.ini_options]
markers = ["docker: needs a running Docker daemon (real databases in containers)"]
testpaths = ["tests"]
