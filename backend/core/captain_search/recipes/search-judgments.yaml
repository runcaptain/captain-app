id: search-judgments
label: Search ranking with judgments
description: Rank search results against graded (query, product) judgments, scored on a sealed test set.
slots:
  - {id: catalog, label: Catalog, role: catalog, accepts: [catalog], required: true,
     why: "The products to rank."}
  - {id: labels, label: Judgments, role: labels, accepts: [judgments], required: true,
     why: "Graded (query, product) pairs. They score the test set, and can train the ranker."}
  - {id: holdout, label: Sealed test set, role: holdout, accepts: [queries], required: false,
     why: "Optional. Queries kept back from training, so the score isn't on data the model saw."}
  - {id: events, label: Events, role: events, accepts: [events, logs], required: false,
     why: "Optional. Click or purchase logs, if your trainer uses them as features."}
trainers:
  - {id: your-command, label: Your training command, command: "python train.py",
     why: "Your script reads CST_TRAIN_INPUTS and writes CST_OUT/result.yaml (the trainer contract)."}
evaluation:
  method: holdout
  holdout: true
  text: >-
    Scores both rankers on the sealed test set with the judgments. If the training labels and the test set grades come
    from the same labeler, a win only says the model agrees with its own labeler.
